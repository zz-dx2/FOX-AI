
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090710">
  <title>FOX AI | Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #090710;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #120e1c;
      border: 1px solid #38244b;
      border-radius: 22px;
      padding: 30px 24px;
      box-shadow: 0 0 45px #9b5de522;
      text-align: center;
    }

    .logo {
      color: #b47aff;
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .fox { font-size: 48px; margin: 12px; }

    h2 { margin-bottom: 8px; }

    .sub {
      color: #a99bb7;
      font-size: 14px;
      margin-bottom: 25px;
    }

    input {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border: 1px solid #49345e;
      border-radius: 12px;
      background: #090710;
      color: white;
      outline: none;
      font-size: 15px;
      direction: rtl;
    }

    input:focus { border-color: #b47aff; }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: #9b5de5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    .switch {
      background: transparent;
      border: 1px solid #49345e;
      margin-top: 10px;
    }

    .message {
      margin-top: 18px;
      color: #c9a6ff;
      font-size: 14px;
      line-height: 1.7;
    }

    .hidden { display: none; }

    .logout {
      background: #382044;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">FOX AI</div>
    <div class="fox">🦊</div>

    <section id="auth">
      <h2 id="title">أهلاً بك في FOX AI</h2>
      <p class="sub" id="subtitle">سجل دخولك وابدأ رحلتك الذكية</p>

      <input id="name" class="hidden"
        type="text" placeholder="اسمك">

      <input id="email" type="email"
        placeholder="البريد الإلكتروني">

      <input id="password" type="password"
        placeholder="كلمة المرور">

      <button id="submit" onclick="handleAuth()">
        تسجيل الدخول
      </button>

      <button class="switch" id="toggle"
        onclick="toggleMode()">
        إنشاء حساب جديد
      </button>

      <div class="message" id="message"></div>
    </section>

    <section id="account" class="hidden">
      <h2>مرحباً بك 👋</h2>
      <p class="sub" id="userEmail"></p>
      <p>تم تسجيل دخولك بنجاح إلى FOX AI.</p>
      <button class="logout" onclick="logout()">
        تسجيل الخروج
      </button>
    </section>
  </main>

  <script>
    const SUPABASE_URL =
      "https://tzahbxcibrzgttuhqiwo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_gpf1LcJ-nkHxopiT8ZnJ8Q_kTUhMIEG";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let isRegister = false;

    const $ = id => document.getElementById(id);

    function showMessage(text) {
      $("message").textContent = text;
    }

    function toggleMode() {
      isRegister = !isRegister;

      $("name").classList.toggle("hidden", !isRegister);

      $("title").textContent = isRegister
        ? "إنشاء حساب جديد"
        : "أهلاً بك في FOX AI";

      $("subtitle").textContent = isRegister
        ? "أنشئ حسابك وابدأ رحلتك"
        : "سجل دخولك وابدأ رحلتك الذكية";

      $("submit").textContent = isRegister
        ? "إنشاء الحساب"
        : "تسجيل الدخول";

      $("toggle").textContent = isRegister
        ? "لديك حساب؟ سجل دخولك"
        : "إنشاء حساب جديد";

      showMessage("");
    }

    async function handleAuth() {
      const email = $("email").value.trim();
      const password = $("password").value;
      const name = $("name").value.trim();

      if (!email || !password) {
        return showMessage("اكتب البريد الإلكتروني وكلمة المرور");
      }

      if (isRegister && !name) {
        return showMessage("اكتب اسمك أولاً");
      }

      if (password.length < 8) {
        return showMessage("كلمة المرور يجب أن تكون 8 أحرف على الأقل");
      }

      $("submit").disabled = true;
      showMessage("جاري تنفيذ طلبك...");

      try {
        if (isRegister) {
          const { data, error } = await db.auth.signUp({
            email,
            password,
            options: {
              data: { display_name: name },
              emailRedirectTo:
                "https://zz-dx2.github.io/FOX-AI/"
            }
          });

          if (error) throw error;

          if (data.session) {
            showMessage("تم إنشاء حسابك بنجاح!");
          } else {
            showMessage("تم إنشاء الحساب. راجع بريدك الإلكتروني لتأكيده، ثم سجل الدخول.");
          }

        } else {
          const { error } =
            await db.auth.signInWithPassword({
              email,
              password
            });

          if (error) throw error;
        }

      } catch (error) {
        showMessage("تعذر إتمام العملية: " + error.message);
      } finally {
        $("submit").disabled = false;
      }
    }

    async function logout() {
      const { error } = await db.auth.signOut();

      if (error) {
        alert(error.message);
      }
    }

    function updateScreen(session) {
      $("auth").classList.toggle("hidden", !!session);
      $("account").classList.toggle("hidden", !session);

      if (session) {
        $("userEmail").textContent =
          session.user.email;
      }
    }

    db.auth.onAuthStateChange((event, session) => {
      updateScreen(session);
    });

    db.auth.getSession().then(({ data }) => {
      updateScreen(data.session);
    });
  </script>
</body>
</html>
