
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090710">
  <title>FOX AI | Your Intelligent World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #090710;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 270px;
      background: #100d19;
      border-left: 1px solid #292034;
      padding: 25px 18px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      color: #b47aff;
      letter-spacing: 1px;
      margin-bottom: 35px;
    }

    .logo span {
      color: white;
    }

    .new-chat {
      padding: 14px;
      border: 1px solid #7845a8;
      border-radius: 12px;
      color: white;
      background: #21162f;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 30px;
    }

    .new-chat:hover {
      background: #38204d;
    }

    .history-title {
      color: #8f829e;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .history {
      color: #c5b9d1;
      font-size: 14px;
    }

    .profile {
      margin-top: auto;
      padding: 15px 5px;
      border-top: 1px solid #292034;
      color: #bca9ce;
      font-size: 14px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    header {
      padding: 22px 30px;
      border-bottom: 1px solid #211a2c;
      color: #bda8d4;
      font-size: 14px;
    }

    .content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
    }

    .welcome h1 {
      font-size: clamp(30px, 5vw, 48px);
      margin-bottom: 15px;
    }

    .welcome h1 span {
      color: #b47aff;
    }

    .welcome p {
      color: #9d91aa;
      line-height: 1.8;
      margin-bottom: 35px;
    }

    .fox-icon {
      font-size: 65px;
      margin-bottom: 20px;
    }

    .chat-area {
      width: min(700px, 100%);
    }

    .input-box {
      display: flex;
      gap: 10px;
      background: #171221;
      border: 1px solid #443052;
      border-radius: 18px;
      padding: 12px;
    }

    .input-box input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 15px;
      padding: 8px;
    }

    .input-box button {
      border: none;
      background: #9b5de5;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
    }

    .input-box button:hover {
      background: #b47aff;
    }

    .hint {
      color: #746a80;
      font-size: 12px;
      margin-top: 15px;
    }

    @media(max-width: 650px) {
      .sidebar {
        width: 75px;
        padding: 20px 10px;
        align-items: center;
      }

      .logo {
        font-size: 16px;
      }

      .new-chat {
        font-size: 20px;
        padding: 12px;
      }

      .new-chat .label,
      .history-title,
      .history,
      .profile {
        display: none;
      }

      header {
        padding: 20px 15px;
      }

      .content {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">FOX<span> AI</span></div>

      <button class="new-chat" onclick="newChat()">
        <span>＋</span>
        <span class="label"> محادثة جديدة</span>
      </button>

      <div class="history-title">المحادثات السابقة</div>
      <div class="history">لا توجد محادثات بعد</div>

      <div class="profile">👤 زائر FOX AI</div>
    </aside>

    <main class="main">
      <header>FOX AI / المساعد الذكي</header>

      <section class="content">
        <div class="chat-area">
          <div class="welcome">
            <div class="fox-icon">🦊</div>
            <h1>مرحباً بك في <span>FOX AI</span></h1>
            <p>
              عالمك الذكي يبدأ من هنا.<br>
              اسأل، اكتشف، وابدع مع FOX AI.
            </p>
          </div>

          <div class="input-box">
            <input
              id="message"
              type="text"
              placeholder="اكتب رسالتك هنا..."
            >
            <button onclick="sendMessage()">إرسال ↑</button>
          </div>

          <div class="hint">
            FOX AI — YOUR INTELLIGENT WORLD
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    function newChat() {
      document.getElementById("message").value = "";
      document.getElementById("message").focus();
    }

    function sendMessage() {
      const input = document.getElementById("message");
      if (!input.value.trim()) {
        input.focus();
        return;
      }
      alert("سيتم تفعيل المساعد الذكي في الخطوات القادمة!");
    }
  </script>
</body>
</html>
